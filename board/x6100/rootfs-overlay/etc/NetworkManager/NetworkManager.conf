# NetworkManager on the X6100. x6100-launcher drives it with nmcli
# (Wi-Fi on the screen and on the web page); saved networks are keyfiles
# in system-connections, kept on /data.

[main]
plugins=keyfile
dhcp=internal
rc-manager=symlink

[device]
wifi.backend=wpa_supplicant
# The RTL8723BU does not like scanning with random addresses.
wifi.scan-rand-mac-address=no

[connection]
# Power saving adds hundreds of ms of latency (network games, SSH): off.
wifi.powersave=2

[logging]
level=WARN
