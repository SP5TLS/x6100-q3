# BlueZ on the X6100. Pairing goes through x6100-btd, which accepts
# requests only while a pairing window is open (x6100-bt pair /
# x6100-bt discoverable, as the launcher uses them). Paired devices are
# kept on /data.

[General]
Name = X6100
DiscoverableTimeout = 180
AlwaysPairable = false
PairableTimeout = 180
JustWorksRepairing = confirm
FastConnectable = true

[Policy]
AutoEnable = true
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
