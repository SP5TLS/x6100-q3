# Network time.
pool pool.ntp.org iburst maxsources 4

# The radio may have been off for weeks: step the clock whenever it is
# more than a second off, not only at start-up.
makestep 1.0 -1

# Keep the battery-backed PCF8563 (rtc0) in step with the system clock.
rtcsync

driftfile /var/lib/chrony/drift
