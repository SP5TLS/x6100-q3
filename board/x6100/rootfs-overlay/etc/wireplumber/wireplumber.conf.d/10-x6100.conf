# WirePlumber on the X6100.

# Started as "wireplumber --profile x6100" by S55audio: the system-wide
# profile (no session D-Bus, no logind), without camera support.
wireplumber.profiles = {
    x6100 = {
        inherits = [ main-systemwide ]
        hardware.video-capture = disabled
    }
}

wireplumber.settings = {
    # Keep A2DP quality: never switch headphones to the headset profile
    # just because something records.
    bluetooth.autoswitch-to-headset-profile = false
    # Streams follow the default output instead of where they last played.
    node.stream.restore-target = false
}

monitor.bluez.properties = {
    # The radio is the audio source for headphones and speakers (A2DP).
    # SBC and SBC-XQ only (no AAC: its encoder is not free software).
    bluez5.roles = [ a2dp_source ]
    bluez5.codecs = [ sbc sbc_xq ]
    bluez5.enable-sbc-xq = true
}

monitor.bluez.rules = [
    {   # Connected headphones/speakers become the default output.
        matches = [ { node.name = "~bluez_output.*" } ]
        actions = { update-props = { priority.session = 2000 } }
    }
    {   matches = [ { device.name = "~bluez_card.*" } ]
        actions = {
            update-props = {
                bluez5.auto-connect = [ a2dp_sink ]
            }
        }
    }
]
