# PipeWire on the X6100: one system-wide instance (run by S55audio).
#
# Outputs: Bluetooth headphones or speakers, USB sound cards. When none
# is there, the silent sink below is the default, so a game never fails
# to open its sound.

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 2048
}

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "x6100-no-output"
            node.description = "No output"
            media.class      = "Audio/Sink"
            audio.position   = [ FL FR ]
            priority.session = 500
            priority.driver  = 1
            node.always-process = false
        }
    }
]
