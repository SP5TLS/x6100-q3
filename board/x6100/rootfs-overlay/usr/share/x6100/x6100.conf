# x6100-q3 system settings. Copy lines into x6100.conf on the SD card's
# X6100 partition (/mnt on the radio) to change them; they are read at
# boot. Values here are the defaults.

# Wi-Fi regulatory domain (ISO 3166 country code; 00 = world, the most
# conservative). Set yours to get all channels allowed where you are.
COUNTRY=00

# Time zone for the system clock shown in logs.
TZ=UTC

# CPU frequency policy: performance (always 1.2 GHz, best for the game)
# or schedutil (follows load, saves some battery).
CPU_GOVERNOR=performance

# Bluetooth: off keeps the radio's 2.4 GHz transmitter blocked.
BLUETOOTH=on
# Name other devices see when the radio is discoverable.
BT_NAME=X6100

# SSH: keys from authorized_keys on this partition (or ssh/authorized_keys)
# are installed for root at boot. Root's password is 123; set a new one
# here to change it (it is applied, then removed from this file).
SSH_PASSWORD=

# Web page (game data upload, Wi-Fi, Bluetooth, start/stop the game) on
# port 80, http://x6100.local/: on, or off (then only this radio itself
# reaches it, for the quake3 command).
WEB=on
# A password for the web page (user name: anything). Empty: none, so
# anyone on your network can use it, as anyone can try SSH.
WEB_PASSWORD=

# Quake 3 started at power-on instead of showing the launcher's menu:
# off or boot. Leaving the game brings the menu back.
QUAKE3=off
# Game started by QUAKE3=boot and a plain `quake3`: baseq3, missionpack
# (Team Arena), baseoa (OpenArena) or a mod's directory.
QUAKE3_GAME=baseq3
# Picture rotation for the sideways panel: 270, or 90 if the game comes
# out upside down.
QUAKE3_ROTATE=270
# Extra ioquake3 arguments, e.g. "+set r_rotateGamma 0 +set com_maxfps 60".
QUAKE3_ARGS=

# Write a diagnostics report to x6100-diag.txt here a minute after boot.
DIAG_AT_BOOT=on
