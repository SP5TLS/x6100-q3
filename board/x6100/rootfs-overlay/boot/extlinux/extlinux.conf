# Read by U-Boot's standard boot (extlinux). The root filesystem stays
# read-only; system state lives on /data, user files on /mnt.
default x6100
timeout 0

label x6100
	kernel /boot/zImage
	fdt /boot/sun8i-r16-xiegu-x6100.dtb
	append root=PARTUUID=58363130-01 rootfstype=ext4 rootwait ro console=ttyS0,115200 quiet loglevel=3 consoleblank=0 vt.global_cursor_default=0 fbcon=rotate:3 fbcon=logo-pos:center fbcon=logo-count:1 panic=10
