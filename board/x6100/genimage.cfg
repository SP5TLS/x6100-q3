# SD card image for the X6100.
#
#   8 KiB   U-Boot SPL + U-Boot (Allwinner boot ROM looks here)
#   p1      x6100-root  ext4, read-only system (kernel, DTB, extlinux.conf
#           in /boot)
#   p2      x6100-data  ext4, system state (empty; filled at first boot)
#   p3      X6100       FAT32 user partition, created at first boot in the
#           rest of the card (/etc/init.d/S00storage)
#
# The disk signature fixes p1's PARTUUID (58363130-01) for root= in
# extlinux.conf.

image data.ext4 {
	ext4 {
		label = "x6100-data"
		use-mke2fs = true
	}
	empty = true
	size = 256M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x58363130
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}

	partition rootfs {
		partition-type = 0x83
		bootable = true
		image = "rootfs.ext4"
		offset = 1M
	}

	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
